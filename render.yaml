# Render Blueprint (optional). In the dashboard, set Root Directory to daylybread-backend.
#
# Chord import (CifraClub / Ultimate Guitar) uses headless Chromium on the server.
# It does NOT open a browser on the user's phone — same GraphQL API as before.
#
# Use at least 1 GB RAM on the web service; 512 MB often OOMs when Chromium starts.

services:
  - type: web
    name: daylybread-api
    runtime: node
    rootDir: daylybread-backend
    # postinstall runs `tsc` so dist/ exists even if the dashboard Build Command is only `npm install`.
    # Still run media/browser ensures here so Practice + chord import work on the slug.
    buildCommand: npm install && node scripts/ensure-practice-media-deps.cjs && node scripts/ensure-chord-fetch-deps.cjs
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # Set in the Render dashboard (never commit the real key).
      - key: BIBLE_BRAIN_API_KEY
        sync: false
      # Optional overrides — defaults are fine for most deploys.
      - key: BIBLE_BRAIN_BASE_URL
        value: https://4.dbt.io
      - key: BIBLE_BRAIN_TIMEOUT_MS
        value: "15000"
      - key: BIBLE_BRAIN_MAX_RETRIES
        value: "3"
      - key: BIBLE_BRAIN_MAX_CONCURRENT
        value: "10"
      - key: BIBLE_BRAIN_BOOK_CONCURRENCY
        value: "5"
